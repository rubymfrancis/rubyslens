<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Selected photographs from Ruby's Lens, a personal photographic archive.">
  <title>Work — Ruby's Lens</title>
  <style>
    :root { --paper:#f8f7f4; --ink:#242422; --muted:#777670; --line:#dcdad4; }
    * {box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}
    .wrap{width:min(1280px,calc(100% - 64px));margin:auto}
    header{padding:30px 0;border-bottom:1px solid var(--line)}
    header .wrap{display:flex;align-items:center;justify-content:space-between;gap:25px}
    .brand{font:normal 29px Georgia,'Times New Roman',serif;letter-spacing:-1.3px}
    nav{display:flex;gap:25px;flex-wrap:wrap;font-size:12px;letter-spacing:.11em;text-transform:uppercase}
    nav a[aria-current="page"]{border-bottom:1px solid currentColor;padding-bottom:4px}
    .intro{padding:86px 0 72px;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:end}
    h1{margin:0;font:normal clamp(66px,11vw,155px)/.93 Georgia,'Times New Roman',serif;letter-spacing:-.065em}
    .intro p{max-width:350px;margin:0 0 8px auto;font-size:14px;line-height:1.8;color:var(--muted)}
    .gallery{display:grid;grid-template-columns:repeat(12,1fr);column-gap:22px;row-gap:92px;padding-bottom:125px}
    figure{margin:0;min-width:0}figure img{width:100%;height:100%;display:block;object-fit:cover}
    .media{background:#e5e2dc;overflow:hidden;position:relative}
    .media::after{content:attr(data-placeholder);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px Arial,sans-serif;letter-spacing:.1em;color:#8b8880;pointer-events:none}
    .media:has(img[src])::after{display:none}
    figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:13px;font-size:11px;letter-spacing:.04em;color:var(--muted)}
    .one{grid-column:1/10}.one .media{aspect-ratio:1.38}
    .two{grid-column:8/13}.two .media{aspect-ratio:3/4}
    .three{grid-column:2/8}.three .media{aspect-ratio:4/5}
    .four{grid-column:5/13}.four .media{aspect-ratio:1.52}
    .five{grid-column:1/6}.five .media{aspect-ratio:4/5}
    .six{grid-column:7/13}.six .media{aspect-ratio:1/1}
    footer{border-top:1px solid var(--line);padding:26px 0 38px;font-size:12px;color:var(--muted)}
    footer .wrap{display:flex;justify-content:space-between;gap:20px}
    @media(max-width:700px){.wrap{width:calc(100% - 36px)}header{padding:22px 0}.brand{font-size:24px}nav{gap:13px;font-size:10px}.intro{display:block;padding:65px 0 46px}.intro p{margin:26px 0 0;max-width:290px}.gallery{grid-template-columns:repeat(2,1fr);gap:43px 12px;padding-bottom:80px}.one,.four{grid-column:1/3}.two,.five{grid-column:2/3}.three,.six{grid-column:1/3}.media{aspect-ratio:4/5!important}.one .media,.four .media{aspect-ratio:1.24!important}figcaption{font-size:10px}footer .wrap{flex-wrap:wrap}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="index.html">ruby's lens.</a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="work.html" aria-current="page">Work</a><a href="index.html#archive">Archive</a><a href="index.html#about">About</a></nav></div></header>
  <main class="wrap">
    <section class="intro"><h1>Selected<br>work.</h1><p>A collection of moments, places and details. An evolving photographic journal by Ruby.</p></section>
    <section class="gallery" aria-label="Photography gallery">
      <figure class="one"><div class="media"><img src="images/BC5C7970-732F-4AD7-AA95-076F155C72EF_1_201_a.jpeg" alt="Featured photograph from Ruby's Lens" loading="eager"></div><figcaption><span>01 / Selected photograph</span><span>Ruby's Lens</span></figcaption></figure>
      <figure class="two"><div class="media"><img src="images/chiz9.jpeg" alt="Photograph of Chiz by Ruby" loading="lazy"></div><figcaption><span>02 / Photograph</span><span>Ruby's Lens</span></figcaption></figure>
      <figure class="three"><div class="media"><img src="images/claudia2.jpeg" alt="Photograph of Claudia by Ruby" loading="lazy"></div><figcaption><span>03 / Photograph</span><span>Ruby's Lens</span></figcaption></figure>
      <figure class="four"><div class="media"><img src="images/emily1.jpeg" alt="Photograph of Emily by Ruby" loading="lazy"></div><figcaption><span>04 / Photograph</span><span>Ruby's Lens</span></figcaption></figure>
      <figure class="five"><div class="media"><img src="images/emily2.jpeg" alt="Second photograph of Emily by Ruby" loading="lazy"></div><figcaption><span>05 / Photograph</span><span>Ruby's Lens</span></figcaption></figure>
      <figure class="six"><div class="media"><img src="images/lauren4.jpeg" alt="Photograph of Lauren by Ruby" loading="lazy"></div><figcaption><span>06 / Photograph</span><span>Ruby's Lens</span></figcaption></figure>
    </section>
  </main>
  <footer><div class="wrap"><span>© Ruby's Lens</span><span>A personal photographic archive</span></div></footer>
</body>
</html>
